<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shahab | Portfolio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins', sans-serif;
}

body{
  color:white;
}

/* NAVBAR */
nav{
  position:absolute;
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 10%;
  z-index:2;
}

nav h1{
  font-size:24px;
  font-weight:700;
}

nav button{
  padding:8px 15px;
  border:none;
  border-radius:5px;
  background:#3b82f6;
  color:white;
  cursor:pointer;
}

/* HERO SECTION */
.hero{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;

  /* BACKGROUND IMAGE WITH DARK OVERLAY */
  background:linear-gradient(
      rgba(0,0,0,0.6),
      rgba(0,0,0,0.6)
    ),
    url("shahabimage.jpg");

  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}

.hero h2{
  font-size:48px;
  font-weight:800;
}

.hero span{
  color:#3b82f6;
}

.hero p{
  margin-top:20px;
  max-width:600px;
  font-weight:300;
  opacity:0.9;
}
</style>
</head>

<body>

<nav>
  <h1>Shahab</h1>
  <button>Contact</button>
</nav>

<section class="hero">
  <h2>Hello, I'm <span>Shahab</span></h2>
  <p>I build modern and responsive websites using HTML, CSS and JavaScript.</p>
</section>

</body>
</html>
